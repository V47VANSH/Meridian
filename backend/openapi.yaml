openapi: 3.1.0
info:
  title: Apartment Complex Management System API
  description: "\nBackend API for the **Apartment Complex Management System** — a multi-tenant\nplatform\
    \ where one deployment serves many societies, each isolated by\n`tenant_id`.\n\n### Authentication\n\
    Call `POST /api/v1/auth/login`, then send the access token as\n`Authorization: Bearer <token>` on\
    \ every other request. The token carries the\ncaller's role and society; both are read from the token,\
    \ never from the request\nbody, so a caller cannot act outside their own society.\n\n### Errors\n\
    Every failure returns the same shape:\n\n```json\n{\"statusCode\": 409, \"error\": \"SLOT_ALREADY_BOOKED\"\
    ,\n \"message\": \"This slot has already been booked\", \"requestId\": \"…\"}\n```\n\nQuote `requestId`\
    \ when reporting a problem — it ties the response to the\nserver-side log entry.\n"
  contact:
    name: Team 98
  license:
    name: MIT
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new user in a society
      description: 'Create an account inside a society.


        Emails are unique **per society**, not globally, so the same person can

        hold accounts in two societies. `SUPER_ADMIN` and `SOCIETY_OFFICIAL` cannot

        be self-assigned — an administrator provisions those.'
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Society or flat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered in this society
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Weak password or privileged role requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Exchange credentials for an access and refresh token
      description: 'Authenticate and receive a token pair.


        A wrong email and a wrong password return the identical error, so the

        response cannot be used to discover which emails are registered.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate a refresh token for a fresh token pair
      description: 'Issue a new token pair and revoke the token that was presented.


        Rotation means a stolen refresh token is usable at most once, and its reuse

        is detectable because the stored record is already revoked.'
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke a refresh token
      description: Revoke the supplied refresh token so it can no longer be rotated.
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get the authenticated user's profile
      description: Return the profile behind the presented access token.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/tenants:
    get:
      tags:
      - Society Administration
      summary: List all societies (platform admin only)
      description: Return every society on the platform.
      operationId: list_tenants_api_v1_tenants_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TenantResponse'
                type: array
                title: Response List Tenants Api V1 Tenants Get
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Society Administration
      summary: Onboard a new society (platform admin only)
      description: Create a society. Only the platform operator can do this.
      operationId: create_tenant_api_v1_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/flats:
    post:
      tags:
      - Society Administration
      summary: Add a flat to the society
      description: Register a flat. `(block, flat_number)` is unique within a society.
      operationId: create_flat_api_v1_flats_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Flat already exists in this society
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Society Administration
      summary: List flats in the caller's society
      description: 'Return the society''s flats, optionally filtered by block or occupancy.


        Without `mine`, this is the society-wide list an official works from. With

        `mine=true` it answers "which flat am I in?" — the question a resident''s

        guest pass, SOS alert and invoice screens need answered, and which cannot

        be derived from the society-wide list.'
      operationId: list_flats_api_v1_flats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: block
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to a single block
          title: Block
        description: Filter to a single block
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          description: Return only the flats the caller owns or rents
          default: false
          title: Mine
        description: Return only the flats the caller owns or rents
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlatResponse'
                title: Response List Flats Api V1 Flats Get
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/flats/{flat_id}/occupants:
    post:
      tags:
      - Society Administration
      summary: Link a user to a flat
      description: Record that a user owns or rents a flat.
      operationId: assign_occupant_api_v1_flats__flat_id__occupants_post
      security:
      - HTTPBearer: []
      parameters:
      - name: flat_id
        in: path
        required: true
        schema:
          type: string
          title: Flat Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatAssignRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Flat or user not found in this society
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is already linked to this flat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    post:
      tags:
      - Society Administration
      summary: Add a new user to the society (Society Official)
      description: Society official registers a new user into the society database.
      operationId: create_user_api_v1_users_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists in this society
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Society Administration
      summary: List users in the caller's society
      description: Society directory. Scoped to the caller's society by the token claim.
      operationId: list_users_api_v1_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          description: Filter by role
          title: Role
        description: Filter by role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users Api V1 Users Get
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit-logs:
    get:
      tags:
      - Society Administration
      summary: List society audit log history (Society Official)
      description: Return audit log entries for the caller's society.
      operationId: list_audit_logs_api_v1_audit_logs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuditLogResponse'
                type: array
                title: Response List Audit Logs Api V1 Audit Logs Get
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/maintenance/invoices:
    post:
      tags:
      - Maintenance & Payments
      summary: Raise a maintenance invoice for a flat
      description: 'Create one invoice for one flat for one month.


        `(tenant, flat, period)` is unique, so re-running the monthly billing job

        cannot double-charge a resident.'
      operationId: create_invoice_api_v1_maintenance_invoices_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Flat not found in this society
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invoice already exists for this period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid period format or non-positive amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Maintenance & Payments
      summary: List maintenance invoices
      description: 'Return invoices visible to the caller.


        Officials see the whole society; every other role sees only invoices for

        flats they are linked to.'
      operationId: list_invoices_api_v1_maintenance_invoices_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/InvoiceStatus'
          - type: 'null'
          description: Filter by invoice status
          title: Status
        description: Filter by invoice status
      - name: flat_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Officials only: filter to one flat'
          title: Flat Id
        description: 'Officials only: filter to one flat'
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by billing month, YYYY-MM
          title: Period
        description: Filter by billing month, YYYY-MM
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
                title: Response List Invoices Api V1 Maintenance Invoices Get
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/maintenance/invoices/{invoice_id}:
    get:
      tags:
      - Maintenance & Payments
      summary: Get a single invoice
      description: Fetch one invoice, provided the caller is entitled to see it.
      operationId: get_invoice_api_v1_maintenance_invoices__invoice_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          title: Invoice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/maintenance/invoices/{invoice_id}/pay:
    post:
      tags:
      - Maintenance & Payments
      summary: Create a payment order for an invoice
      description: 'Open a gateway order so the client can launch checkout.


        The order is recorded as `CREATED`; the invoice is only marked paid once a

        signed confirmation arrives, never on the strength of this call alone.'
      operationId: create_payment_order_api_v1_maintenance_invoices__invoice_id__pay_post
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          title: Invoice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrderResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invoice is already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/maintenance/invoices/{invoice_id}/payments/confirm:
    post:
      tags:
      - Maintenance & Payments
      summary: Confirm a payment against an invoice
      description: 'Verify the gateway signature, then settle the invoice.


        The HMAC over `<order_id>|<payment_id>` is checked **before** anything is

        trusted — without it a client could mark any invoice paid for free.'
      operationId: confirm_payment_api_v1_maintenance_invoices__invoice_id__payments_confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          title: Invoice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invoice or payment order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invoice is already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/maintenance/payments:
    get:
      tags:
      - Maintenance & Payments
      summary: List payment records
      description: Payment history for the caller's flats, or the whole society for officials.
      operationId: list_payments_api_v1_maintenance_payments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaymentResponse'
                type: array
                title: Response List Payments Api V1 Maintenance Payments Get
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/maintenance/summary:
    get:
      tags:
      - Maintenance & Payments
      summary: Collection summary for the society
      description: Aggregate counts and totals powering the official's dashboard.
      operationId: summary_api_v1_maintenance_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceSummaryResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role is not permitted to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/maintenance/flats/{flat_id}/risk-score:
    get:
      tags:
      - Maintenance & Payments
      summary: Payment-risk score for a flat
      description: 'Predict how likely a flat is to pay late, so reminders can go out early.


        Backed by the ML service in production; the deterministic fallback keeps

        this endpoint answering even when the model is unavailable.'
      operationId: risk_score_api_v1_maintenance_flats__flat_id__risk_score_get
      security:
      - HTTPBearer: []
      parameters:
      - name: flat_id
        in: path
        required: true
        schema:
          type: string
          title: Flat Id
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
          description: Billing month, YYYY-MM
