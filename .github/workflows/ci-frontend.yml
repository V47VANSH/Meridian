# Frontend CI (docs/05-devops-architecture.md section 4).

name: ci-frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.yaml"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/openapi.yaml"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check the generated API types are current
        # The client is codegen'd from the backend's published contract. If the
        # spec moved and these were not regenerated, the app would typecheck
        # against a contract the API no longer serves — the exact drift the
        # generated client exists to prevent.
        run: |
          npm run gen:api
          if ! git diff --quiet -- src/api/generated/schema.d.ts; then
            echo "::error::src/api/generated/schema.d.ts is out of date. Run: npm run gen:api"
            git diff -- src/api/generated/schema.d.ts
            exit 1
          fi

      - name: Build
        run: npm run build
