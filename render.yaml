# Render service definitions for the API and the ML service.
#
# The frontend is not here — it is deployed on Vercel (see vercel.json), which
# rewrites /api/* to the API service below. That rewrite is what keeps the
# browser talking to a single origin in production exactly as it does behind the
# Vite dev proxy locally, so no CORS configuration is needed in either place.
#
# The database is Supabase Postgres, not a Render database, so it is not defined
# here. Set DATABASE_URL on the API service to the Supabase connection string
# (the "Session pooler" URI, with `postgresql+psycopg://` as the scheme).
#
# Values marked `sync: false` are set by hand in the Render dashboard and are
# never committed.

services:
  - type: web
    name: meridian-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run immediately before the server starts. Render's dedicated
    # preDeployCommand would be the better home for this, but it is a paid-plan
    # feature and is ignored on free — which would silently skip migrations.
    # AUTO_CREATE_TABLES is off below, so Alembic is the only thing that ever
    # touches this schema.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Database ---------------------------------------------------------
      # Supabase connection string. Must use the psycopg driver:
      #   postgresql+psycopg://postgres.<ref>:<password>@<host>:5432/postgres
      - key: DATABASE_URL
        sync: false
      # Alembic owns the schema here; never let create_all near it.
      - key: AUTO_CREATE_TABLES
        value: "false"
      # Seeds the demo society on first boot only — seed_if_empty is a no-op
      # once any society exists, so this is safe to leave on across redeploys.
      - key: SEED_ON_STARTUP
        value: "true"

      # --- Auth -------------------------------------------------------------
      # Generated by Render, not committed. Rotating it invalidates every
      # issued token, which is the intended behaviour for a secret leak.
      - key: JWT_SECRET
        generateValue: true

      # --- Redis ------------------------------------------------------------
      # Optional. Without it the booking lock and rate limiter fall back to
      # in-process equivalents, which are correct for a single instance. Set it
      # to an Upstash URL before scaling past one.
      - key: REDIS_URL
        sync: false

      # --- Rate limiting ----------------------------------------------------
      # Render terminates TLS and sets X-Forwarded-For, so the limiter can
      # trust it here. It must stay false anywhere the header is client-supplied.
      - key: TRUST_PROXY_HEADERS
        value: "true"

      # --- ML service -------------------------------------------------------
      # Set to the ML service's full URL including scheme, e.g.
      #   https://meridian-ml.onrender.com
      # Not interpolated from the sibling service: Render's `hostport` property
      # yields "host:port" with no scheme, and the client builds its request URL
      # by concatenation, so a scheme-less value produces an unusable URL.
      # Leaving it unset is safe — classification falls back to keyword rules.
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SHARED_SECRET
        generateValue: true

      # --- Payments ---------------------------------------------------------
      # Razorpay test-mode keys. Without them the API still records an order and
      # tells the resident online payment cannot complete, rather than showing a
      # false receipt.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # --- AI assistant -----------------------------------------------------
      # Unset, the assistant falls back to rule-based intent matching.
      - key: GEMINI_API_KEY
        sync: false

      # --- CORS -------------------------------------------------------------
      # The Vercel rewrite means the browser calls the API same-origin, so this
      # is only exercised by direct calls to the Render URL (Swagger UI, curl).
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: meridian-ml
    runtime: python
    plan: free
    region: singapore
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Reports whether each trained artifact is loadable, not merely that the
    # process is up — a service with no model would fail every request.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Must match ML_SHARED_SECRET on the API service. Copy the generated
      # value across in the dashboard; Render cannot share a generated secret
      # between services automatically.
      - key: ML_SHARED_SECRET
        sync: false
